# Painel da E3 (issue #45): responde à pergunta de gestão lendo as tabelas finais do dbt.
# Abre em http://localhost:8501 depois do `docker compose up`.
services:
  painel:
    build: ../painel
    image: blackspot-painel:local
    pull_policy: build
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-blackspot}
      # Papel só de leitura das tabelas de consumo (db/migrations/V0020__acesso.sql).
      PGUSER: painel_leitor
      PGPASSWORD: ${PAINEL_DB_PASSWORD:-painel_leitor}
    ports:
      - "127.0.0.1:${PAINEL_PORT:-8501}:8501"
    depends_on:
      db:
        condition: service_healthy
      # O papel painel_leitor é criado pela migração.
      migrate:
        condition: service_completed_successfully
