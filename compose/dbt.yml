# Projeto dbt da E3 (base comum). Roda sob demanda, fora do `docker compose up`:
#
#   docker compose run --rm dbt build      # modelos e testes
#   docker compose run --rm dbt debug      # confere a conexão
#
# A ordem de execução no dia a dia é da orquestração (compose/orquestracao.yml).
# O serviço só espera o banco ficar saudável: num banco novo, rode antes o `migrate` e o
# `load` (`docker compose up`), senão as views de origem ainda não existem e o build falha.
# O projeto em dbt/ é montado só para leitura; os artefatos do dbt (target/, logs/) vão
# para /tmp dentro do container. Contrato em docs/e3/README.md.
services:
  dbt:
    build: ..
    image: blackspot-app:local
    pull_policy: build
    profiles: [dbt]
    working_dir: /app/dbt
    entrypoint: ["dbt"]
    command: ["build"]
    environment:
      DBT_PROFILES_DIR: /app/dbt
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-blackspot}
      PGUSER: ${POSTGRES_USER:-blackspot}
      PGPASSWORD: ${POSTGRES_PASSWORD:-blackspot}
    volumes:
      - ../dbt:/app/dbt:ro
    depends_on:
      db:
        condition: service_healthy
