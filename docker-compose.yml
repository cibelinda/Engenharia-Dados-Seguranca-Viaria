# Esteira completa do BlackSpot. Um `docker compose up` sobe o banco, cria o
# esquema, baixa os dados da PRF e carrega no banco, nesta ordem:
#
#   db ──(saudável)──► migrate ──┐
#                                 ├──(ambos terminaram)──► load
#   download ─────────────────────┘
#
# `migrate` e `download` rodam em paralelo; `load` só começa quando os dois
# terminaram sem erro. Se algum falhar, `load` não roda.

# E2: cada parte tem o próprio arquivo de serviços, para que cada pessoa trabalhe sem
# mexer neste arquivo (ver docs/e2/README.md). Um `docker compose up` sobe tudo junto.
include:
  - compose/lote.yml   # ingestão em lote: Postgres -> Parquet/Delta (issue da Ana)
  - compose/cdc.yml    # captura de mudanças: Debezium e Redpanda (issue da Cibelly)
  # E3: cada parte tem o próprio arquivo, como na E2 (ver docs/e3/README.md).
  - compose/dbt.yml            # projeto dbt (base comum da E3)
  - compose/ibge.yml           # base de municípios do IBGE (issue da Ana)
  - compose/orquestracao.yml   # orquestração agendada (issue da Maria)
  - compose/painel.yml         # painel analítico (issue da Ana)

# Configuração comum aos serviços que usam o código Python (Dockerfile).
x-app: &app
  build: .
  image: blackspot-app:local
  # Reconstrói a imagem a cada `up` (usa cache, leva segundos), para nunca rodar
  # uma versão antiga do código depois de um `git pull`.
  pull_policy: build
  environment:
    BLACKSPOT_RAW_DIR: data/raw
    BLACKSPOT_DOWNLOAD_JOBS: ${BLACKSPOT_DOWNLOAD_JOBS:-4}
    PGHOST: db
    PGPORT: 5432
    PGDATABASE: ${POSTGRES_DB:-blackspot}
    PGUSER: ${POSTGRES_USER:-blackspot}
    PGPASSWORD: ${POSTGRES_PASSWORD:-blackspot}
  volumes:
    - rawdata:/app/data/raw

services:
  # PostgreSQL 18 com a extensão espacial PostGIS 3.6 (ADR 0002): a PRF publica latitude
  # e longitude das ocorrências desde 2017, e a pergunta de gestão é sobre onde os
  # acidentes graves se concentram.
  db:
    image: postgis/postgis:18-3.6
    container_name: blackspot-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blackspot}
      POSTGRES_USER: ${POSTGRES_USER:-blackspot}
      # Senha padrão só para desenvolvimento local (a porta escuta apenas em 127.0.0.1).
      # Para trocar, defina POSTGRES_PASSWORD no .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackspot}
    ports:
      # Só localhost: sem isso a porta fica exposta em todas as interfaces da máquina.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A partir do PostgreSQL 18 a imagem oficial usa /var/lib/postgresql como volume.
      - pgdata:/var/lib/postgresql
    # wal_level=logical: o WAL passa a guardar o suficiente para a captura de mudanças (CDC,
    # E2) ler as alterações com decodificação lógica.
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica, em ordem, as migrações de db/migrations/ (V1__..., V2__...). O Flyway
  # registra na tabela flyway_schema_history o que já rodou, então subir de novo
  # só aplica as migrações novas.
  migrate:
    image: flyway/flyway:13.8.0-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-blackspot}
      FLYWAY_USER: ${POSTGRES_USER:-blackspot}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-blackspot}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  # Baixa o dataset completo da PRF (docs/pergunta-e-recorte.md): os 50 arquivos do
  # sources.yaml, BR-Brasil 2007–2016 e BAT 2017 em diante, ~370 MB. Arquivos já
  # baixados e íntegros não são baixados de novo.
  download:
    <<: *app
    command: python -m blackspot.download

  # Carga no banco, um ano por vez (blackspot/load.py).
  load:
    <<: *app
    command: python -m blackspot.load
    depends_on:
      migrate:
        condition: service_completed_successfully
      download:
        condition: service_completed_successfully

  # Testes (issue #8): `docker compose run --rm tests`. Fica num perfil próprio
  # para não rodar no `docker compose up`. BLACKSPOT_EXIGIR_BANCO=1 faz a falta
  # de banco virar erro, e não teste pulado. Cada teste de dados desfaz o que
  # gravou, então pode rodar no banco já carregado.
  tests:
    <<: *app
    profiles: [tests]
    command: >
      env BLACKSPOT_EXIGIR_BANCO=1 PYTHONDONTWRITEBYTECODE=1
      python -m unittest discover -s tests -v
    volumes:
      - rawdata:/app/data/raw
      - ./tests:/app/tests:ro
      - ./db/migrations:/app/db/migrations:ro
      # Valores esperados dos testes de volume (bench/perfil_recorte.py).
      - ./bench/resultados:/app/bench/resultados:ro
      # Camada analítica da E2, para os testes do lote e do CDC lerem as tabelas Delta.
      - lakehouse:/app/lake:ro
    # Espera a carga: os testes rodam sobre o banco já carregado.
    depends_on:
      load:
        condition: service_completed_successfully

volumes:
  pgdata:
  # Os ZIPs baixados ficam num volume do Docker, e não em ./data/raw, para não
  # haver problema de permissão de arquivo entre o container e a máquina.
  rawdata:
  # Camada analítica da E2: tabelas Delta (Parquet) do lote e do CDC. Os arquivos em
  # compose/ declaram o mesmo volume, e o Compose junta tudo num volume só.
  lakehouse:
