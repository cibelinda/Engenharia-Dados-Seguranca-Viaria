# Manifesto das fontes de dados do BlackSpot.
#
# Construído a partir do reconhecimento de 2026-09-27 (docs/fontes/), com os
# IDs do Google Drive validados manualmente um a um. NÃO regenere este arquivo
# raspando a página da PRF: ela contém links ocultos que apontam para arquivos
# de outros anos (ver docs/fontes/README.md, seção "Mecanismo de download").
#
# `reference` registra o estado do arquivo na última verificação. A PRF
# regrava arquivos no mesmo ID/nome, então divergência de sha256 é esperada
# ao longo do tempo: o downloader avisa e só atualiza a referência quando
# pedido explicitamente (--accept-new-hash KEY | --accept-all-new-hashes).

provider:
  name: Polícia Rodoviária Federal (PRF)
  page: https://www.gov.br/prf/pt-br/acesso-a-informacao/dados-abertos/dados-abertos-da-prf
  dictionary_page: https://www.gov.br/prf/pt-br/acesso-a-informacao/dados-abertos/dicionario-acidentes
  update_frequency: mensal (declarada pela PRF)

download:
  # Endpoint público do Google Drive; {drive_id} é substituído por entrada.
  url_template: https://drive.usercontent.google.com/download?id={drive_id}&export=download&confirm=t

