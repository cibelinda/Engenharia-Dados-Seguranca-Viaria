# Configuração do site no GitHub Pages
# (https://cibelinda.github.io/Engenharia-Dados-Seguranca-Viaria/).
# Tema just-the-docs: menu lateral e busca. Os títulos e a ordem do menu ficam
# aqui em "defaults", para não precisar mexer no início de cada documento.

title: BlackSpot
description: Engenharia de Dados aplicada à Segurança Viária — BD2 / FCTE-UnB
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

lang: pt-BR
search_enabled: true

# Cores: esquema roxo (_sass/color_schemes/roxo.scss) e ajustes em _sass/custom/custom.scss.
color_scheme: roxo

# Quadros de destaque: {: .destaque } ou {: .atencao } antes do parágrafo.
callouts:
  destaque:
    title: Em destaque
    color: purple
  atencao:
    title: Atenção
    color: yellow

# Rodapé: _includes/footer_custom.html.
heading_anchors: true

# Diagramas em Mermaid (docs/arquitetura-e-modelos.md).
mermaid:
  version: "11.12.0"
back_to_top: true
back_to_top_text: "Voltar ao topo"
aux_links:
  "Repositório no GitHub": https://github.com/cibelinda/Engenharia-Dados-Seguranca-Viaria
aux_links_new_tab: true

relative_links:
  enabled: true
  collections: false

# Os dados baixados não vão para o site. O resto fica, para os links dos documentos
# para arquivos de código (ex.: blackspot/load.py) continuarem funcionando.
exclude:
  - data/

# Menu: as páginas ficam em quatro seções (parent), cada uma com uma página de abertura.
defaults:
  - scope: { path: "" }
    values: { layout: default, nav_exclude: true }
  - scope: { path: "README.md" }
    values: { title: "Início", nav_order: 1, nav_exclude: false, permalink: / }
  # Dados e modelagem
  - scope: { path: "docs/pergunta-e-recorte.md" }
    values: { title: "Pergunta e recorte", parent: "Dados e modelagem", nav_order: 1, nav_exclude: false }
  - scope: { path: "docs/fontes/README.md" }
    values: { title: "Fonte de dados", parent: "Dados e modelagem", nav_order: 2, nav_exclude: false }
  - scope: { path: "docs/caracterizacao-da-carga.md" }
    values: { title: "Caracterização da carga", parent: "Dados e modelagem", nav_order: 3, nav_exclude: false }
  - scope: { path: "docs/modelagem-origem.md" }
    values: { title: "Modelagem da origem", parent: "Dados e modelagem", nav_order: 4, nav_exclude: false }
  # Decisões (ADRs)
  - scope: { path: "docs/adr/0001-modelo-normalizado-insert-only-versionado-por-lote.md" }
    values: { title: "ADR 0001 · Histórico insert-only", parent: "Decisões (ADRs)", nav_order: 1, nav_exclude: false }
  - scope: { path: "docs/adr/0002-banco-espacial-postgis.md" }
    values: { title: "ADR 0002 · Banco com PostGIS", parent: "Decisões (ADRs)", nav_order: 2, nav_exclude: false }
  - scope: { path: "docs/adr/0003-dataset-completo-br-brasil-e-bat.md" }
    values: { title: "ADR 0003 · Dataset completo", parent: "Decisões (ADRs)", nav_order: 3, nav_exclude: false }
  # Processo
  - scope: { path: "diario-de-bordo.md" }
    values: { title: "Diário de bordo", parent: "Processo", nav_order: 1, nav_exclude: false }
  - scope: { path: "AI-USAGE.md" }
    values: { title: "Uso de IA", parent: "Processo", nav_order: 2, nav_exclude: false }
