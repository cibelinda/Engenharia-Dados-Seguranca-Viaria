# Configuração do site no GitHub Pages
# (https://cibelinda.github.io/Engenharia-Dados-Seguranca-Viaria/).
# Tema just-the-docs: menu lateral e busca. Os títulos e a ordem do menu ficam
# aqui em "defaults", para não precisar mexer no início de cada documento.

title: BlackSpot
description: Engenharia de Dados aplicada à Segurança Viária — BD2 / FCTE-UnB
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

lang: pt-BR
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Voltar ao topo"
aux_links:
  "Repositório no GitHub": https://github.com/cibelinda/Engenharia-Dados-Seguranca-Viaria
aux_links_new_tab: true

relative_links:
  enabled: true
  collections: false

# Os dados baixados não vão para o site. O resto fica, para os links dos documentos
# para arquivos de código (ex.: blackspot/load.py) continuarem funcionando.
exclude:
  - data/

defaults:
  - scope: { path: "" }
    values: { layout: default, nav_exclude: true }
  - scope: { path: "README.md" }
    values: { title: "Início", nav_order: 1, nav_exclude: false, permalink: / }
  - scope: { path: "docs/pergunta-e-recorte.md" }
    values: { title: "Pergunta e recorte", nav_order: 2, nav_exclude: false }
  - scope: { path: "docs/fontes/README.md" }
    values: { title: "Fonte de dados", nav_order: 3, nav_exclude: false }
  - scope: { path: "docs/caracterizacao-da-carga.md" }
    values: { title: "Caracterização da carga", nav_order: 4, nav_exclude: false }
  - scope: { path: "docs/modelagem-origem.md" }
    values: { title: "Modelagem da origem", nav_order: 5, nav_exclude: false }
  - scope: { path: "docs/adr/0001-modelo-normalizado-insert-only-versionado-por-lote.md" }
    values: { title: "ADR 0001", nav_order: 6, nav_exclude: false }
  - scope: { path: "diario-de-bordo.md" }
    values: { title: "Diário de bordo", nav_order: 7, nav_exclude: false }
  - scope: { path: "AI-USAGE.md" }
    values: { title: "Uso de IA", nav_order: 8, nav_exclude: false }
