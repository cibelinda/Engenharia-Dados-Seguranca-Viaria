# Configuração do site no GitHub Pages
# (https://cibelinda.github.io/Engenharia-Dados-Seguranca-Viaria/).
# Tema just-the-docs: menu lateral e busca. Os títulos e a ordem do menu ficam
# aqui em "defaults", para não precisar mexer no início de cada documento.

title: BlackSpot
description: Engenharia de Dados aplicada à Segurança Viária — BD2 / FCTE-UnB
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

lang: pt-BR
search_enabled: true

# Cores: esquema roxo (_sass/color_schemes/roxo.scss) e ajustes em _sass/custom/custom.scss.
color_scheme: roxo

# Quadros de destaque: {: .destaque } ou {: .atencao } antes do parágrafo.
callouts:
  destaque:
    title: Em destaque
    color: purple
  atencao:
    title: Atenção
    color: yellow

# Rodapé: _includes/footer_custom.html.
heading_anchors: true

# Diagramas em Mermaid.
mermaid:
  version: "11.12.0"
back_to_top: true
back_to_top_text: "Voltar ao topo"
aux_links:
  "Repositório no GitHub": https://github.com/cibelinda/Engenharia-Dados-Seguranca-Viaria
aux_links_new_tab: true

relative_links:
  enabled: true
  collections: false

# O site é a apresentação do projeto: a página inicial (index.md) e as páginas de paginas/. A
# documentação técnica completa (docs/, ADRs, README) e os registros do processo ficam só no
# repositório, e as páginas apontam para lá.
exclude:
  - README.md
  - AI-USAGE.md
  - diario-de-bordo.md
  - docs/
  - data/
  - bench/
  - blackspot/
  - compose/
  - db/
  - tests/
  - Dockerfile
  - docker-compose.yml
  - requirements.txt
  - sources.yaml

# Menu: a ordem vem do nav_order de cada página.
defaults:
  - scope: { path: "" }
    values: { layout: default }
